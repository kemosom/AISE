name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Lab 01 starter and behavioral engine
        run: python scripts/validate_lab01.py

      - name: Install Lab 02 ML dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Validate Lab 02 data and ML pipeline
        run: python scripts/validate_lab02.py

      - name: Validate Lab 03 starter and locked instructor preview
        run: python scripts/validate_lab03.py

      - name: Validate Lab 04 browser compiler, regression tests and agent hints
        run: node scripts/validate_lab04.mjs

      - name: Install plotting package for Lab 04 analysis QA
        run: python -m pip install --disable-pip-version-check matplotlib

      - name: Validate Lab 04 quiz checkpoints and CSV-based figures
        run: node scripts/validate_lab04_analysis.mjs

      - name: Validate Lab 04 complete batch and Gemini recovery
        run: node scripts/validate_lab04_batch.mjs
